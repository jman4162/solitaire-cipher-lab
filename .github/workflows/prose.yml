name: prose

on:
  pull_request:
    paths: ["**/*.md", "src/**/*.py", "web/index.html"]
  workflow_dispatch:

jobs:
  prose:
    name: prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Advisory: flags writing patterns, not authorship, and has known domain
      # false positives (see scripts/slopcheck.sh). Never gate a merge on it.
      - run: scripts/slopcheck.sh
        continue-on-error: true

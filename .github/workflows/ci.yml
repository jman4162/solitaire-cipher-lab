name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Web data is fresh and the SVG renderer runs
        run: |
          python scripts/build_web.py
          git diff --exit-code web/data
          solitaire-lab render rounds --ordered-deck -o /tmp/round.svg

  conformance:
    name: JS engine conformance (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: python -m pip install -e .
      # The full vector set is ~24MB and is generated here rather than committed.
      # web/engine.js must reproduce every one of these traces exactly.
      - name: Generate conformance vectors from the Python engine
        run: python scripts/gen_conformance.py
      - name: Check the JavaScript engine against them
        run: node --test tests/conformance/*.test.mjs
      - name: The committed smoke set must also stand alone
        run: |
          rm tests/conformance/vectors.json
          node --test tests/conformance/*.test.mjs
